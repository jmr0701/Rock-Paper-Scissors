<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <h1>Rock, Paper, Scissors</h1>

    <div class="windowContainer">
        <div class="playerWindow">Player</div>
        <div class="computerWindow">Computer</div>
    </div>

    <div class="handButtons">
        <img src="images/Rock.svg" alt="A hand in the shape of a fist to gesture a rock" id="btnRock">
        <img src="images/Paper.svg" alt="An open hand to gesture a paper" id="btnPaper">
        <img src="images/Scissors.svg" alt="A hand in the shape of a pair of scissors" id="btnScissors">
    </div>

    <script src="javascript/javascript.js"></script>
</body>
</html>
